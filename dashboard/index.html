<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#a94868">
<title>My Gifts</title>
<meta name="author" content="RAHUL KD">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23a94868' d='M12 21s-7.5-4.6-10-9.3C.5 8.4 2 4.8 5.6 4.1c2-.4 3.9.5 5 2.1.9-1.6 2.9-2.5 5-2.1C19.1 4.8 20.6 8.4 19.1 11.7 16.6 16.4 12 21 12 21z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#d88ba3; --rose-deep:#a94868; --plum:#4a2438;
    --cream:#fbf5ef; --paper:#fff; --line:#eadfe0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--cream); font-family:'Manrope',sans-serif; color:var(--plum); min-height:100vh;}
  .icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;fill:currentColor;flex-shrink:0;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    max-width:960px; margin:0 auto; padding:34px 24px 10px;
  }
  header h1{ font-family:'Fraunces',serif; font-weight:600; font-size:1.6rem; }
  header .userbar{ display:flex; align-items:center; gap:14px; font-size:.82rem; color:#8a6d7b;}
  header .userbar button{
    background:none; border:1.5px solid var(--line); color:var(--plum);
    padding:8px 16px; border-radius:9px; font-size:.8rem; font-weight:700; cursor:pointer;
  }
  header .userbar button:hover{ border-color:var(--rose); background:#faf4f1; }

  .wrap{ max-width:960px; margin:0 auto; padding:20px 24px 100px; }

  .toolbar{ display:flex; justify-content:flex-end; margin-bottom:28px; }
  .new-btn{
    background:var(--plum); color:#fff; border:none; padding:13px 24px;
    border-radius:11px; font-weight:700; font-size:.85rem; cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:8px;
    transition:background .15s ease;
  }
  .new-btn .icon{width:.95em;height:.95em;}
  .new-btn:hover{ background:var(--rose-deep); }

  .empty{
    text-align:center; padding:80px 20px; color:#a58897;
  }
  .empty .icon{width:2.4rem;height:2.4rem;color:#d8b8c5;margin-bottom:14px;}
  .empty h2{ font-family:'Fraunces',serif; font-weight:600; color:var(--plum); font-size:1.4rem; margin-bottom:8px;}
  .empty p{ font-size:.9rem; margin-bottom:22px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; }

  .gift-card{
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:24px; box-shadow:0 10px 28px rgba(74,36,56,.07);
    display:flex; flex-direction:column; gap:14px;
    animation: fadeUp .4s ease both;
  }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;} }

  .qr-thumb{
    width:100%; aspect-ratio:1; border-radius:12px; border:1px solid var(--line);
    background:#faf4f1; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .qr-thumb img{ width:80%; height:80%; object-fit:contain; }

  .gift-to{ font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem; }
  .gift-date{ font-size:.72rem; color:#a58897; }
  .gift-snippet{
    font-size:.82rem; color:#7a5c6a; line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }

  .card-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .card-actions button, .card-actions a{
    flex:1; text-align:center; font-size:.76rem; font-weight:700; padding:10px 8px;
    border-radius:9px; border:1.5px solid var(--line); background:none; color:var(--plum);
    cursor:pointer; text-decoration:none; transition:border-color .15s, background .15s;
    display:inline-flex; align-items:center; justify-content:center; gap:5px; min-width:80px;
  }
  .card-actions .icon{width:.95em;height:.95em;}
  .card-actions button:hover, .card-actions a:hover{ border-color:var(--rose); background:#faf4f1; }
  .card-actions .primary{ background:var(--plum); color:#fff; border-color:var(--plum); }
  .card-actions .primary:hover{ background:var(--rose-deep); border-color:var(--rose-deep); }
  .card-actions .danger{ flex:0 0 auto; min-width:40px; color:#a33a3a; border-color:#f0d5d5; }
  .card-actions .danger:hover{ background:#fdeeee; border-color:#e8a8a8; }

  .status{ text-align:center; padding:80px 20px; color:#a58897; font-size:.9rem; }
  .status.error{ color:#a33a3a; }

  .spinner-wrap{ display:flex; justify-content:center; padding:80px 20px; }
  .spinner{ width:28px; height:28px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--rose-deep); animation:spin .8s linear infinite; }
  @keyframes spin{ to{transform:rotate(360deg);} }

  /* confirm dialog */
  .overlay{ position:fixed; inset:0; background:rgba(74,36,56,.35); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.show{ display:flex; }
  .confirm-box{ background:#fff; border-radius:16px; padding:26px; max-width:340px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .confirm-box h3{ font-family:'Fraunces',serif; font-size:1.1rem; margin-bottom:8px; }
  .confirm-box p{ font-size:.85rem; color:#8a6d7b; margin-bottom:20px; line-height:1.5;}
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions button{ flex:1; padding:10px; border-radius:9px; font-weight:700; font-size:.82rem; cursor:pointer; border:1.5px solid var(--line); background:none; color:var(--plum); }
  .confirm-actions .del-yes{ background:#a33a3a; border-color:#a33a3a; color:#fff; }
  .confirm-actions .del-yes:hover{ background:#8a2f2f; }
  .confirm-actions .del-no:hover{ border-color:var(--rose); }
  .credit{ text-align:center; font-size:.72rem; color:#b09aa5; margin:20px 0 6px; }
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    <symbol id="i-heart-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2 4.8 5.6 4.1c2-.4 3.9.5 5 2.1.9-1.6 2.9-2.5 5-2.1C19.1 4.8 20.6 8.4 19.1 11.7 16.6 16.4 12 21 12 21z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M20 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
  </defs>
</svg>

<header>
  <h1>My Gifts</h1>
  <div class="userbar">
    <span id="userEmail"></span>
    <button id="signOutBtn">Sign out</button>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <a class="new-btn" href="/creator/"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"></use></svg> New gift</a>
  </div>

  <div class="spinner-wrap" id="loadingState"><div class="spinner"></div></div>
  <div id="emptyState" class="empty" style="display:none;">
    <svg class="icon" viewBox="0 0 24 24"><use href="#i-heart-outline"></use></svg>
    <h2>No gifts yet</h2>
    <p>Everything you create will show up here — link, QR, all of it.</p>
    <a class="new-btn" href="/creator/"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"></use></svg> Create your first gift</a>
  </div>
  <div id="errorState" class="status error" style="display:none;"></div>
  <div id="grid" class="grid"></div>
  <div class="credit">DEVELOPER BY RAHUL KD</div>
</div>

<!-- delete confirmation -->
<div class="overlay" id="delOverlay">
  <div class="confirm-box">
    <h3>Delete this gift?</h3>
    <p>The link and QR code will stop working. This can't be undone.</p>
    <div class="confirm-actions">
      <button class="del-no" id="delCancel">Cancel</button>
      <button class="del-yes" id="delConfirm">Delete</button>
    </div>
  </div>
</div>

<script>
(function(){
  // Plain HTML/CSS/JS — talks to Firebase REST APIs directly, no SDK/module imports.
  var API_KEY = "AIzaSyC8ofOMzCWXFcoOvbgbY4EyJMaeQXu_4z0";
  var PROJECT_ID = "friendship-web-3610c";
  var GIFT_PAGE_URL = window.location.origin + "/gift/";
  var FIRESTORE_URL = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents:runQuery?key=" + API_KEY;
  var FIRESTORE_BASE = "https://firestore.googleapis.com/v1/";

  var idToken = null, uid = null, userEmail = null;
  try {
    idToken = localStorage.getItem('idToken');
    uid = localStorage.getItem('userUid');
    userEmail = localStorage.getItem('userEmail');
  } catch (e) {}

  if (!idToken || !uid) { window.location.href = "/"; return; }

  document.getElementById('userEmail').textContent = userEmail || '';

  document.getElementById('signOutBtn').addEventListener('click', function(){
    try {
      localStorage.removeItem('idToken');
      localStorage.removeItem('refreshToken');
      localStorage.removeItem('userEmail');
      localStorage.removeItem('userUid');
    } catch (e) {}
    window.location.href = "/";
  });

  function fsVal(field) {
    if (!field) return null;
    if ('stringValue' in field) return field.stringValue;
    if ('timestampValue' in field) return field.timestampValue;
    if ('integerValue' in field) return field.integerValue;
    return null;
  }

  function loadGifts() {
    var loadingEl = document.getElementById('loadingState');
    var emptyEl   = document.getElementById('emptyState');
    var errorEl   = document.getElementById('errorState');
    var grid      = document.getElementById('grid');

    var body = {
      structuredQuery: {
        from: [{ collectionId: 'gifts' }],
        where: {
          fieldFilter: {
            field: { fieldPath: 'ownerUid' },
            op: 'EQUAL',
            value: { stringValue: uid }
          }
        }
      }
    };

    fetch(FIRESTORE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
      body: JSON.stringify(body)
    })
    .then(function(res){ return res.json(); })
    .then(function(rows){
      loadingEl.style.display = 'none';

      var docs = (rows || [])
        .filter(function(r){ return r.document; })
        .map(function(r){
          var f = r.document.fields || {};
          return {
            docName: r.document.name, // full Firestore resource path, needed for delete
            giftId: fsVal(f.giftId),
            toName: fsVal(f.toName),
            fromName: fsVal(f.fromName),
            message: fsVal(f.message),
            createdAt: fsVal(f.createdAt)
          };
        });

      if (docs.length === 0) { emptyEl.style.display = 'block'; return; }

      docs.sort(function(a,b){
        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
      });

      docs.forEach(function(data, i){
        var card = renderCard(data);
        card.style.animationDelay = (i * 60) + 'ms';
        grid.appendChild(card);
      });
    })
    .catch(function(err){
      console.error(err);
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = "Could not load gifts: " + (err.message || err);
    });
  }

  function renderCard(data) {
    var el = document.createElement('div');
    el.className = 'gift-card';

    var fullLink = GIFT_PAGE_URL + '?id=' + data.giftId;
    var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(fullLink) + '&color=4A2438&bgcolor=FFFFFF&margin=10';
    var dateStr = '';
    if (data.createdAt) {
      var d = new Date(data.createdAt);
      if (!isNaN(d)) dateStr = d.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });
    }

    el.innerHTML =
      '<div class="qr-thumb"><img src="' + qrUrl + '" alt="QR for ' + escH(data.toName) + '" loading="lazy"></div>' +
      '<div class="gift-to">For ' + escH(data.toName || '—') + '</div>' +
      '<div class="gift-date">' + dateStr + '</div>' +
      '<div class="gift-snippet">' + escH(data.message || '') + '</div>' +
      '<div class="card-actions">' +
        '<button class="copy-btn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-copy"></use></svg> Copy</button>' +
        '<a class="primary" href="' + fullLink + '" target="_blank"><svg class="icon" viewBox="0 0 24 24"><use href="#i-open"></use></svg> Open</a>' +
        '<button class="danger del-btn" aria-label="Delete gift"><svg class="icon" viewBox="0 0 24 24"><use href="#i-trash"></use></svg></button>' +
      '</div>';

    el.querySelector('.copy-btn').addEventListener('click', function(e){
      navigator.clipboard.writeText(fullLink);
      var btn = e.currentTarget;
      var original = btn.innerHTML;
      btn.textContent = 'Copied!';
      setTimeout(function(){ btn.innerHTML = original; }, 1600);
    });

    el.querySelector('.del-btn').addEventListener('click', function(){
      askDelete(data.docName, el);
    });

    return el;
  }

  // ---- Delete flow ----
  var overlay = document.getElementById('delOverlay');
  var pendingDocName = null, pendingCardEl = null;

  function askDelete(docName, cardEl) {
    pendingDocName = docName;
    pendingCardEl = cardEl;
    overlay.classList.add('show');
  }
  function closeOverlay() {
    overlay.classList.remove('show');
    pendingDocName = null;
    pendingCardEl = null;
  }
  document.getElementById('delCancel').addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeOverlay(); });

  document.getElementById('delConfirm').addEventListener('click', function(){
    if (!pendingDocName) return;
    var btn = document.getElementById('delConfirm');
    btn.disabled = true; btn.textContent = 'Deleting…';

    fetch(FIRESTORE_BASE + pendingDocName + '?key=' + API_KEY, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + idToken }
    })
    .then(function(res){
      if (!res.ok) return res.json().then(function(d){ throw new Error((d.error && d.error.message) || 'Delete failed'); });
      var cardEl = pendingCardEl;
      cardEl.style.transition = 'opacity .25s, transform .25s';
      cardEl.style.opacity = '0';
      cardEl.style.transform = 'scale(.96)';
      setTimeout(function(){
        cardEl.remove();
        if (!document.getElementById('grid').children.length) {
          document.getElementById('emptyState').style.display = 'block';
        }
      }, 250);
      closeOverlay();
    })
    .catch(function(err){
      console.error(err);
      alert('Could not delete: ' + err.message);
      closeOverlay();
    })
    .finally(function(){
      btn.disabled = false; btn.textContent = 'Delete';
    });
  });

  function escH(str) {
    var d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  loadGifts();
})();
</script>
</body>
</html>
